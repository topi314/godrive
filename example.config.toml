listen_addr = ":80"
dev_mode = false
debug = false
# Used when the API is built with -tags dev (no embedded UI):
# frontend_url = "http://localhost:3000"

[log]
level = "INFO"
format = "text"
add_source = false

[database]
# type can be "sqlite" or "postgres"
type = "sqlite"
debug = false
path = "godrive.db"
# postgres fields:
# host = "localhost"
# port = 5432
# username = "godrive"
# password = "godrive"
# database = "godrive"
# ssl_mode = "disable"

[storage]
# type can be "local" or "s3"
type = "local"
debug = false
path = "storage"
# sync_interval = "15m" # optional backstop reconcile; omit or "0" to disable

# S3-compatible (AWS, R2, B2, Garage, MinIO, …):
# type = "s3"
# endpoint = "https://s3.amazonaws.com"
# access_key_id = "..."
# secret_access_key = "..."
# bucket = "godrive"
# region = "us-east-1"
# secure = true
# force_path_style = false

[storage.notify]
# webhook_secret = "..."
# sqs_queue_url = ""

# OIDC via Authelia (or any OIDC IdP). See example.production.toml for a live-shaped template.
# jwt_secret from the old JSON config is unused (DB sessions).
# [auth]
# secure = false
# issuer = "https://auth.example.com"
# client_id = "godrive"
# client_secret = "..."
# redirect_url = "http://localhost:3000/api/callback"
# session_lifespan = "15m"
# refresh_token_lifespan = "720h" # 30 days
# Optional RP logout when discovery has no end_session_endpoint:
# end_session_endpoint = "https://auth.example.com/api/oidc/end-session"
# post_logout_redirect_url = "http://localhost:3000/"
# default_home = "/home/{user}"
# Placeholders: {user} / {username}, {email}, {id}. Applied on first login;
# later logins keep the saved home path. Missing folders are created.
#
# [auth.groups]
# admin = "admin"     # OIDC group: full access (bypasses ACLs)
# access = "godrive"  # OIDC group required to use the app (admin also counts)
# guest = true        # allow unauthenticated browsing (uses "guest" ACL, default read)
#
# Map extra OIDC groups to godrive names used in ACLs. Unmapped IdP groups are ignored.
# admin and access are included automatically (same name unless remapped here).
# [auth.groups.map]
# "ldap-linux" = "linux"
# family = "family"
#
# On first start with an empty ACL table, godrive seeds "/":
#   everyone → all (logged-in users); guest → read.
# With auth disabled, all requests get full access (no ACL).


# [upload]
# max_size = "50GB"      # global upload ceiling
# chunk_size = "16MB"    # resumable PATCH body size
# session_ttl = "72h"    # how long incomplete uploads can be resumed
# max_parallel = 2       # concurrent file uploads in the UI

